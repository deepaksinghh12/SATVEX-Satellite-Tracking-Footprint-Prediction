services:
  - type: web
    name: satvex
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /healthz
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "localhost,127.0.0.1,satvex.deepaksinghdev.in,satvex-api.deepaksinghdev.in,.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://satvex.deepaksinghdev.in,https://satvex-api.deepaksinghdev.in,https://*.onrender.com"
      - key: N2YO_API_KEY
        sync: false
